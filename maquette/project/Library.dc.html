<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Launcher — Bibliothèque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Cinzel:wght@700&amp;family=Orbitron:wght@800&amp;family=Fraunces:ital,wght@1,700&amp;family=Bebas+Neue&amp;family=Syne:wght@800&amp;family=Unbounded:wght@700&amp;family=Rubik+Mono+One&amp;family=Audiowide&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0A0A0C; color: #F5F5F7; font-family: Inter, -apple-system, 'Segoe UI', sans-serif">
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 36px 64px 0; display: flex; flex-direction: column">

    <header style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px">
      <div style="display: flex; align-items: center; gap: 14px">
        <button type="button" aria-label="Profil" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        </button>
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Bonsoir</span>
      </div>
      <nav aria-label="Navigation principale" style="display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08)">
        <a href="Main.dc.html" style="padding: 10px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; color: #F5F5F7">Accueil</a>
        <a href="Library.dc.html" aria-current="page" style="padding: 10px 22px; border-radius: 999px; background: #F5F5F7; color: #0A0A0C; font-size: 15px; font-weight: 600">Bibliothèque</a>
        <a href="#" style="padding: 10px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; color: #F5F5F7">Boutiques</a>
        <a href="#" style="padding: 10px 22px; border-radius: 999px; font-size: 15px; font-weight: 500; color: #F5F5F7">Captures</a>
      </nav>
      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 18px">
        <button type="button" aria-label="Rechercher" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
        <a href="Settings.dc.html" aria-label="Réglages" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </a>
        <span style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">21:47</span>
      </div>
    </header>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 44px">
      <div style="display: flex; align-items: baseline; gap: 16px">
        <h1 style="margin: 0; font-size: 48px; font-weight: 700; letter-spacing: -0.03em">Bibliothèque</h1>
        <span style="font-size: 17px; color: #AEAEB2">{{count}}</span>
      </div>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08); color: #F5F5F7; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
        Trier : dernière session
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <div role="group" aria-label="Filtrer par plateforme" style="display: flex; gap: 10px; margin-top: 22px">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="3">
        <button type="button" onClick="{{ chip.pick }}" aria-pressed="{{chip.pressed}}" style="height: 40px; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 15px; cursor: pointer; transition: background .2s ease, color .2s ease; background: {{chip.bg}}; color: {{chip.fg}}; border: {{chip.border}}; font-weight: {{chip.weight}}">{{chip.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 24px; margin-top: 32px">
      <sc-for list="{{games}}" as="item" hint-placeholder-count="12">
        <a href="GameDetail.dc.html" style="display: flex; flex-direction: column; gap: 12px">
          <span style="aspect-ratio: 2 / 3; border-radius: 14px; position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; background: {{item.art}}; box-shadow: {{item.ring}}">
            <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 50%)"></span>
            <span style="position: relative; padding: 22px 14px; text-align: center; line-height: 1.05; color: #FFFFFF; font-family: {{item.font}}; font-size: {{item.size}}; font-weight: {{item.weight}}; font-style: {{item.fs}}; text-transform: {{item.tt}}; letter-spacing: {{item.ls}}">{{item.title}}</span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 15px; font-weight: 600; color: #F5F5F7">{{item.title}}</span>
            <span style="font-size: 13px; color: #AEAEB2">{{item.platform}} · {{item.hours}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(0deg, #0A0A0C 20%, rgba(10,10,12,0) 100%); pointer-events: none"></div>
  <footer aria-label="Commandes" style="position: absolute; right: 64px; bottom: 26px; display: flex; gap: 28px; font-size: 14px; color: #AEAEB2">
    <sc-for list="{{hints}}" as="h" hint-placeholder-count="3">
      <span style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{h.isShape}}" hint-placeholder-val="{{ false }}">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #8E8E93; display: flex; align-items: center; justify-content: center; color: #F5F5F7"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{h.path}}"></path></svg></span>
        </sc-if>
        <sc-if value="{{h.isLetter}}" hint-placeholder-val="{{ true }}">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #8E8E93; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #F5F5F7">{{h.text}}</span>
        </sc-if>
        <sc-if value="{{h.isKey}}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: {{h.radius}}; border: 1.5px solid #8E8E93; border-bottom-width: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #F5F5F7">{{h.text}}</span>
        </sc-if>
        <span>{{h.label}}</span>
      </span>
    </sc-for>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"input":{"editor":"enum","options":["PlayStation","Xbox","Clavier / souris"],"default":"PlayStation"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  logos() {
    return {
      cinzel: { font: "Cinzel, serif", weight: '700', tt: 'uppercase', ls: '0.04em', fs: 'normal', k: 0.82 },
      orbitron: { font: "Orbitron, sans-serif", weight: '800', tt: 'uppercase', ls: '0.02em', fs: 'normal', k: 0.8 },
      fraunces: { font: "Fraunces, serif", weight: '700', tt: 'none', ls: '-0.02em', fs: 'italic', k: 1 },
      bebas: { font: "'Bebas Neue', sans-serif", weight: '400', tt: 'uppercase', ls: '0.04em', fs: 'normal', k: 1.15 },
      syne: { font: "Syne, sans-serif", weight: '800', tt: 'lowercase', ls: '-0.03em', fs: 'normal', k: 1 },
      unbounded: { font: "Unbounded, sans-serif", weight: '700', tt: 'uppercase', ls: '0', fs: 'normal', k: 0.8 },
      rubik: { font: "'Rubik Mono One', sans-serif", weight: '400', tt: 'uppercase', ls: '0', fs: 'normal', k: 0.72 },
      audiowide: { font: "Audiowide, sans-serif", weight: '400', tt: 'uppercase', ls: '0.04em', fs: 'normal', k: 0.9 }
    };
  }
  gameList() {
    return [
      { title: 'Horizon de Cendres', lf: 'cinzel', platform: 'Steam', hours: '34 h', c: ['#FF7A2F', '#B3261E', '#2A0E0A', '#120807'] },
      { title: 'Neon Drift', lf: 'orbitron', platform: 'Epic Games', hours: '12 h', c: ['#FF3D9A', '#2DD4FF', '#1A0B2E', '#07040F'] },
      { title: 'Les Abysses', lf: 'fraunces', platform: 'Steam', hours: '21 h', c: ['#1FC8B4', '#1D4ED8', '#04202A', '#020A10'] },
      { title: 'Forteresse Nord', lf: 'bebas', platform: 'Steam', hours: '56 h', c: ['#CFE8FF', '#5B8DEF', '#14243D', '#0A111C'] },
      { title: 'Verdure', lf: 'syne', platform: 'Steam', hours: '8 h', c: ['#9BE15D', '#1E7A46', '#0C2416', '#06110A'] },
      { title: 'Sillage', lf: 'unbounded', platform: 'Steam', hours: '5 h', c: ['#F5C451', '#7C3AED', '#1E1035', '#0C0716'] },
      { title: 'Atelier 9', lf: 'rubik', platform: 'Steam', hours: '3 h', c: ['#FFE14D', '#FF8A00', '#2B2205', '#0F0C03'] },
      { title: 'Orbite', lf: 'audiowide', platform: 'Steam', hours: '17 h', c: ['#8B9CFF', '#3B1FA6', '#0E0B2B', '#05040F'] },
      { title: 'Basalte', lf: 'bebas', platform: 'Steam', hours: '29 h', c: ['#FF4D4D', '#3A3A3C', '#1C1C1E', '#0A0A0A'] },
      { title: 'Marée Basse', lf: 'fraunces', platform: 'Steam', hours: '11 h', c: ['#7FD3FF', '#F2A07B', '#1B2A3A', '#0B1219'] },
      { title: 'Cartographe', lf: 'cinzel', platform: 'Steam', hours: '42 h', c: ['#E9D8A6', '#94775A', '#2A2117', '#120E09'] },
      { title: 'Ligne Claire', lf: 'syne', platform: 'Steam', hours: '2 h', c: ['#FFFFFF', '#FF5E7E', '#2B2B33', '#111116'] }
    ];
  }
  art(c) {
    return 'radial-gradient(90% 70% at 70% 18%, ' + c[0] + ' 0%, transparent 70%), radial-gradient(100% 80% at 10% 100%, ' + c[1] + ' 0%, transparent 70%), linear-gradient(170deg, ' + c[2] + ' 0%, ' + c[3] + ' 100%)';
  }
  hints(input, actions) {
    const shape = (p) => ({ kind: 'shape', path: p });
    const letter = (t) => ({ kind: 'letter', text: t });
    const key = (t, r) => ({ kind: 'key', text: t, radius: r || '6px' });
    const maps = {
      'PlayStation': { confirm: shape('M6 6l12 12M18 6L6 18'), back: shape('M5 12a7 7 0 1 0 14 0a7 7 0 1 0 -14 0'), options: shape('M12 4.5l8 14H4z'), menu: key('PS', '999px') },
      'Xbox': { confirm: letter('A'), back: letter('B'), options: letter('Y'), menu: letter('≡') },
      'Clavier / souris': { confirm: key('Entrée'), back: key('Échap'), options: key('Clic droit'), menu: key('Tab') }
    };
    const map = maps[input] || maps['PlayStation'];
    return actions.map((a) => {
      const g = map[a[0]];
      return { label: a[1], isShape: g.kind === 'shape', isLetter: g.kind === 'letter', isKey: g.kind === 'key', path: g.path || '', text: g.text || '', radius: g.radius || '6px' };
    });
  }
  renderVals() {
    const filter = (this.state && this.state.filter) || 'Tous';
    const labels = ['Tous', 'Steam', 'Epic Games'];
    const chips = labels.map((l) => {
      const on = l === filter;
      return {
        label: l,
        pressed: on ? 'true' : 'false',
        bg: on ? '#F5F5F7' : 'rgba(255,255,255,.08)',
        fg: on ? '#0A0A0C' : '#F5F5F7',
        border: on ? '1px solid #F5F5F7' : '1px solid rgba(255,255,255,.12)',
        weight: on ? '600' : '500',
        pick: () => this.setState({ filter: l })
      };
    });
    const L = this.logos();
    const list = this.gameList().filter((g) => filter === 'Tous' || g.platform === filter);
    const games = list.map((g, i) => {
      const l = L[g.lf];
      return {
        title: g.title,
        platform: g.platform,
        hours: g.hours,
        art: this.art(g.c),
        ring: i === 0 ? '0 0 0 3px #0A0A0C, 0 0 0 6px #F5F5F7, 0 20px 40px rgba(0,0,0,.55)' : '0 8px 24px rgba(0,0,0,.4)',
        font: l.font, weight: l.weight, tt: l.tt, ls: l.ls, fs: l.fs,
        size: Math.round(24 * l.k) + 'px'
      };
    });
    return {
      chips: chips,
      games: games,
      count: list.length + (list.length > 1 ? ' jeux' : ' jeu'),
      hints: this.hints(this.props.input ?? 'PlayStation', [['confirm', 'Ouvrir'], ['back', 'Retour'], ['menu', 'Menu rapide']])
    };
  }
}
</script>
</body>
</html>
