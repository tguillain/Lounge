<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Launcher — Captures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0C}
a{color:#F5F5F7;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #050507; color: #F5F5F7; font-family: Inter, -apple-system, 'Segoe UI', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(45% 65% at 74% 32%, #FF7A2F22 0%, transparent 72%), linear-gradient(160deg, #140806 0%, #050507 100%)"></div>

  <div role="dialog" aria-label="Horizon de Cendres, capture {{position}} sur {{count}}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
    <div style="width: 1184px; aspect-ratio: 16 / 9; margin-bottom: 24px; border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: {{art}}">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(0deg, rgba(0,0,0,.45) 0%, transparent 100%)"></div>
    </div>

    <button type="button" onClick="{{ previous }}" aria-label="Capture précédente" style="position: absolute; left: 32px; top: 50%; margin-top: -26px; width: 52px; height: 52px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.12); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; opacity: {{leftOpacity}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button type="button" onClick="{{ next }}" aria-label="Capture suivante" style="position: absolute; right: 32px; top: 50%; margin-top: -26px; width: 52px; height: 52px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.12); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; opacity: {{rightOpacity}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>

    <p style="position: absolute; left: 0; right: 0; bottom: 40px; margin: 0; text-align: center; font-size: 15px; color: #8E8E93; font-variant-numeric: tabular-nums">Horizon de Cendres · {{position}} / {{count}}</p>
  </div>

  <a href="GameDetail.dc.html" style="position: absolute; left: 64px; top: 36px; font-size: 13px; color: #8E8E93">S'ouvre avec ✕ sur une capture de la fiche du jeu · ○ y revient</a>
  <footer aria-label="Commandes" style="position: absolute; right: 64px; bottom: 36px; display: flex; gap: 28px; font-size: 14px; color: #AEAEB2">
    <sc-for list="{{hints}}" as="h" hint-placeholder-count="2">
      <span style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{h.isShape}}" hint-placeholder-val="{{ false }}">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #8E8E93; display: flex; align-items: center; justify-content: center; color: #F5F5F7"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="{{h.path}}"></path></svg></span>
        </sc-if>
        <sc-if value="{{h.isLetter}}" hint-placeholder-val="{{ true }}">
          <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #8E8E93; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #F5F5F7">{{h.text}}</span>
        </sc-if>
        <sc-if value="{{h.isKey}}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 8px; border-radius: {{h.radius}}; border: 1.5px solid #8E8E93; border-bottom-width: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #F5F5F7">{{h.text}}</span>
        </sc-if>
        <span>{{h.label}}</span>
      </span>
    </sc-for>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"input":{"editor":"enum","options":["PlayStation","Xbox","Clavier / souris"],"default":"PlayStation"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  hints(input, actions) {
    const shape = (p) => ({ kind: 'shape', path: p });
    const letter = (t) => ({ kind: 'letter', text: t });
    const key = (t, r) => ({ kind: 'key', text: t, radius: r || '6px' });
    const maps = {
      'PlayStation': { navigate: key('◀ ▶', '999px'), back: shape('M5 12a7 7 0 1 0 14 0a7 7 0 1 0 -14 0') },
      'Xbox': { navigate: key('◀ ▶', '999px'), back: letter('B') },
      'Clavier / souris': { navigate: key('← →'), back: key('Échap') }
    };
    const map = maps[input] || maps['PlayStation'];
    return actions.map((a) => {
      const g = map[a[0]];
      return { label: a[1], isShape: g.kind === 'shape', isLetter: g.kind === 'letter', isKey: g.kind === 'key', path: g.path || '', text: g.text || '', radius: g.radius || '6px' };
    });
  }
  renderVals() {
    const shots = [
      'radial-gradient(70% 90% at 30% 30%, #FF7A2F 0%, transparent 70%), linear-gradient(160deg, #3A140C 0%, #120807 100%)',
      'radial-gradient(80% 100% at 80% 100%, #B3261E 0%, transparent 70%), radial-gradient(40% 50% at 25% 20%, #FFB36B99 0%, transparent 70%), linear-gradient(200deg, #2A0E0A 0%, #0A0505 100%)',
      'radial-gradient(60% 80% at 50% 20%, #FFB36B 0%, transparent 70%), linear-gradient(180deg, #4A1A0E 0%, #120807 100%)',
      'radial-gradient(70% 80% at 10% 90%, #FF5A1F 0%, transparent 70%), radial-gradient(50% 60% at 90% 10%, #7A1E0E 0%, transparent 70%), #160A08'
    ];
    const index = this.state && typeof this.state.index === 'number' ? this.state.index : 1;
    return {
      art: shots[index],
      position: String(index + 1),
      count: String(shots.length),
      leftOpacity: index === 0 ? '.25' : '1',
      rightOpacity: index === shots.length - 1 ? '.25' : '1',
      previous: () => this.setState({ index: Math.max(0, index - 1) }),
      next: () => this.setState({ index: Math.min(shots.length - 1, index + 1) }),
      hints: this.hints(this.props.input ?? 'PlayStation', [['navigate', 'Parcourir'], ['back', 'Fermer']])
    };
  }
}
</script>
</body>
</html>
